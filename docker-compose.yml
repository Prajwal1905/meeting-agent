version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: meeting-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n
    container_name: meeting-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false

  backend:
    build: .
    container_name: meeting-backend
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://host.docker.internal:27017
      - QDRANT_URL=http://qdrant:6333
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/meeting
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
  n8n_data: