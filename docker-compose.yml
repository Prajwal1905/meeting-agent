version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: meeting-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    container_name: meeting-backend
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://host.docker.internal:27017
      - QDRANT_URL=http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data: